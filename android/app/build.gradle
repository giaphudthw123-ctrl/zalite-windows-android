plugins { id 'com.android.application' }

android {
    namespace 'org.ctdozlite.mobile'
    compileSdk 36
    buildFeatures { buildConfig true; resValues true }
    defaultConfig {
        applicationId 'org.ctdozlite.mobile'
        minSdk 28
        targetSdk 35
        versionCode 13
        versionName '0.13-local-prototype'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    flavorDimensions 'channel'
    productFlavors {
        fork {
            dimension 'channel'
            applicationIdSuffix '.fork'
            resValue 'string', 'app_name', 'ctdozlite Fork'
            buildConfigField 'String', 'UPDATE_REPO', '"minhkhang1008/ctdozlite-next"'
            buildConfigField 'String', 'UPDATE_ASSET', '"ctdozlite-fork-arm64-v8a.apk"'
        }
        internal {
            dimension 'channel'
            applicationIdSuffix '.internal'
            resValue 'string', 'app_name', 'ctdozlite Nội bộ'
            def repo = (project.findProperty('internalUpdateRepo') ?: '').toString()
            if (repo && !(repo ==~ '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+')) {
                throw new GradleException('internalUpdateRepo must be owner/repo')
            }
            buildConfigField 'String', 'UPDATE_REPO', '"' + repo + '"'
            buildConfigField 'String', 'UPDATE_ASSET', '"ctdozlite-internal-arm64-v8a.apk"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']
}

tasks.named('preBuild') {
    doFirst {
        if (!file('src/main/jniLibs/arm64-v8a/libctdozlite_android.so').exists()) {
            throw new GradleException('Build the shared Rust core for aarch64-linux-android first')
        }
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
